<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiyahEase – Commute with Ease!</title>
    <link rel="icon" href="Image/Biyacon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="Image/Biyacon.png" alt="BiyahEase icon" class="logo-icon">
            <img src="Image/Biyatitle.png" alt="BiyahEase" class="logo-text">
        </div>
    </header>

    <main class="hero">
        <img src="Image/Swirl.png" alt="" class="bg-swirl" aria-hidden="true">

        <div class="hero-visual">
            <img src="Image/Phonedesign.png" alt="BiyahEase app preview showing a jeepney route on a phone" class="phone-img">
            <img src="Image/Biya.png" alt="Biya, the BiyahEase owl mascot" class="biya-owl">
        </div>

        <div class="hero-content">
            <img src="Image/Biyatitle.png" alt="BiyahEase" class="hero-logo">
            <img src="Image/Commutewe.png" alt="Commute with Ease!" class="tagline-img">

            <div class="cta-row">
                <a href="#" class="btn-store" aria-label="Get it on Google Play">
                    <svg class="play-icon" viewBox="0 0 512 512" width="26" height="26" aria-hidden="true">
                        <path fill="#00d4ff" d="M99 11c-9 6-14 16-14 29v432c0 13 5 23 14 29l245-245L99 11z"/>
                        <path fill="#ffe000" d="M344 211l-70-41L99 11c-4 3-8 6-10 11l255 234z"/>
                        <path fill="#ff3a44" d="M274 256L89 466c2 5 6 8 10 11l175-159 70-41-70-21z"/>
                        <path fill="#00f076" d="M413 229l-69-41-70 68 70 68 69-41c19-11 19-43 0-54z"/>
                    </svg>
                    <span class="store-text">
                        <span class="small">GET IT ON</span>
                        <span class="big">Google Play</span>
                    </span>
                </a>
                <a href="#" class="btn-learn">Learn More</a>
            </div>

            <p class="hero-desc">BiyahEase makes traveling easier! Discover destinations, find routes, check fares, and explore places with ease—all in one app.</p>
        </div>
    </main>

    <section class="features">
        <img src="Image/Swirl.png" alt="" class="features-bg" aria-hidden="true">

        <div class="features-row">
            <div class="features-content">
                <h2 class="features-title">Explore. Navigate. Arrive.</h2>
                <p class="features-desc">
                    Discover <strong class="accent-teal">new places</strong>, find the <strong class="accent-teal">best routes</strong>,
                    and travel around with ease using <strong class="accent-brand">BiyahEase</strong>.
                </p>
                <img src="Image/biyasign.png" alt="Biya waiting at a bus stop" class="biya-sign">
            </div>

            <div class="features-visual">
                <img src="Image/AppCp.png" alt="BiyahEase app screen asking where you want to go, with destination suggestions" class="app-phone">
            </div>
        </div>
    </section>

    <script src="script.js" defer></script>
</body>
</html>
